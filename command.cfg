# This file lists command templates for sky (remote) and local (ground) actions.
# Placeholders use ${var} style; code will substitute:
#   ${CHANNEL}   - selected channel number
#   ${BANDWIDTH} - 10/20/40
#   ${WIDTH}     - video width for sky mode
#   ${HEIGHT}    - video height for sky mode
#   ${FPS}       - frame rate for sky mode
#   ${BITRATE_KBPS} - bitrate in kbps (e.g., 2 Mbps -> 2048)
#   ${POWER}     - power level (integer), txpower will use POWER*50 mBm
#   ${ACK_TIME} - local or sky ACK timeout (33, 83, 133, 183, 233, 255)
#   ${MCS}       - sky MCS index (0-12)

[remote]
# Sent via UDP to sky endpoint
channel = ([ -f /etc/wfb.conf ] && sh -c 'tmp=/tmp/wfb_conf.$$.tmp; cp /etc/wfb.conf "$tmp" && sed -i "s/^channel=.*/channel=$1/" "$tmp" && cat "$tmp" > /etc/wfb.conf && rm -f "$tmp"' sh "${CHANNEL}" || wifibroadcast cli -s .wireless.channel "${CHANNEL}") && iwconfig wlan0 channel ${CHANNEL}
bandwidth = ([ -f /etc/wfb.conf ] &&  sh -c 'tmp=/tmp/wfb_conf.$$.tmp; cp /etc/wfb.conf "$tmp" && sed -i "s/^bandwidth=.*/bandwidth=$1/" "$tmp" && cat "$tmp" > /etc/wfb.conf && rm -f "$tmp"' sh "${BANDWIDTH}" || wifibroadcast cli -s .wireless.width ${BANDWIDTH} )
sky_mode = if [ -f /customer/config/camera.conf ]; then sed -i -e 's/^video_width=.*/video_width=${WIDTH}/' -e 's/^video_height=.*/video_height=${HEIGHT}/' -e 's/^video_framerate=.*/video_framerate=${FPS}/' /customer/config/camera.conf && (if [ -x /etc/init.d/S95camera ]; then /etc/init.d/S95camera reload; elif [ -x /customer/S95camera ]; then /customer/S95camera reload; else echo 'S95camera reload script not found' >&2; exit 1; fi); else cli -s .video0.size ${WIDTH}x${HEIGHT} && cli -s .video0.fps ${FPS} && killall -1 majestic; fi
bitrate = (if [ -f /customer/config/camera.conf ]; then sed -i 's/^video_bitrate=.*/video_bitrate=${BITRATE_KBPS}/' /customer/config/camera.conf; else cli -s .video0.bitrate ${BITRATE_KBPS}; fi) && curl -s 'http://localhost/api/v1/set?video0.bitrate=${BITRATE_KBPS}'
sky_power = ([ -f /etc/wfb.conf ] && sh -c 'tmp=/tmp/wfb_conf.$$.tmp; cp /etc/wfb.conf "$tmp" && sed -i "s/^driver_txpower_override=.*/driver_txpower_override=$1/" "$tmp" && cat "$tmp" > /etc/wfb.conf && rm -f "$tmp"' sh "${POWER}" || wifibroadcast cli -s .wireless.txpower ${POWER} ) && iw dev wlan0 set txpower fixed $(( ${POWER} * 50 ))
sky_mcs = ([ -f /etc/wfb.conf ] && sh -c 'tmp=/tmp/wfb_conf.$$.tmp; cp /etc/wfb.conf "$tmp" && sed -i "s/^mcs_index=.*/mcs_index=$1/" "$tmp" && cat "$tmp" > /etc/wfb.conf && rm -f "$tmp" && . /etc/wfb.conf && wfb_tx_cmd 8000 set_radio -B $bandwidth -M $mcs_index -S $stbc -L $ldpc -G $guard_interval' sh "${MCS}" || wifibroadcast cli -s .broadcast.mcs_index ${MCS} )
ack_time = sh -c 'found=0; failed=0; for path in /proc/net/*/*/ack_timeout; do [ -f "$path" ] || continue; found=1; if echo "$1" > "$path"; then echo "[AMLgsMenu] Sky ACK time $1 applied: $path"; else echo "[AMLgsMenu] Sky ACK time write failed: $path" >&2; failed=1; fi; done; if [ "$found" = 0 ]; then echo "[AMLgsMenu] No sky ack_timeout found under /proc/net" >&2; exit 1; fi; exit "$failed"' sh "${ACK_TIME}"
request_idr = curl -s http://localhost/request/idr >/dev/null

[remote_query]
# Allow the OSD to pull current configuration when it starts.
channel = ([ -f /etc/wfb.conf ] && awk -F= '/^channel=/{print $2; exit}' /etc/wfb.conf || wifibroadcast cli -g .wireless.channel)
bandwidth = ([ -f /etc/wfb.conf ] && awk -F= '/^bandwidth=/{print $2; exit}' /etc/wfb.conf || wifibroadcast cli -g .wireless.width)
sky_power = ([ -f /etc/wfb.conf ] && awk -F= '/^driver_txpower_override=/{print $2; exit}' /etc/wfb.conf || wifibroadcast cli -g .wireless.txpower)
sky_mcs = ([ -f /etc/wfb.conf ] && awk -F= '/^mcs_index=/{print $2; exit}' /etc/wfb.conf || wifibroadcast cli -g .broadcast.mcs_index)
bitrate = if [ -f /customer/config/camera.conf ]; then sed -n 's/^video_bitrate=//p' /customer/config/camera.conf; else cli -g .video0.bitrate; fi
sky_size = if [ -f /customer/config/camera.conf ]; then awk -F= '$1=="video_width"{w=$2+0} $1=="video_height"{h=$2+0} END{if(w>0 && h>0) print w "x" h}' /customer/config/camera.conf; else cli -g .video0.size; fi
sky_fps = if [ -f /customer/config/camera.conf ]; then sed -n 's/^video_framerate=//p' /customer/config/camera.conf; else cli -g .video0.fps; fi
camera_config = if [ -f /customer/config/camera.conf ]; then echo camera_conf; fi

[local]
# Executed locally in a background thread; ap_mode=1 targets the connected Wi-Fi
# interface, otherwise monitor interfaces are used.
monitor_channel = sh -c 'for dev in $(iw dev 2>/dev/null | awk '\''/Interface/ {iface=$2} /type[[:space:]]+monitor/ {print iface}'\''); do iw dev $dev set channel ${CHANNEL} ${BW_SUFFIX}; done'
monitor_power = sh -c 'cfg=/storage/digitalfpv/wfb.conf; [ -f "$cfg" ] || cfg=/flash/wfb.conf; [ -f "$cfg" ] && . "$cfg"; if [ "${ap_mode:-0}" = "1" ]; then dev=; for candidate in $(iw dev 2>/dev/null | awk '\''/Interface/ {print $2}'\''); do if iw dev "$candidate" link 2>/dev/null | grep -q "^Connected to "; then dev=$candidate; break; fi; done; [ -n "$dev" ] && iw dev "$dev" set txpower fixed $(( ${POWER} * 50 )); else for dev in $(iw dev 2>/dev/null | awk '\''/Interface/ {iface=$2} /type[[:space:]]+monitor/ {print iface}'\''); do iw dev "$dev" set txpower fixed $(( ${POWER} * 50 )); done; fi'
ack_time = sh -c 'found=0; failed=0; for path in /proc/net/*/*/ack_timeout; do [ -f "$path" ] || continue; found=1; if echo ${ACK_TIME} > "$path"; then echo "[AMLgsMenu] ACK time ${ACK_TIME} applied: $path"; else echo "[AMLgsMenu] ACK time write failed: $path" >&2; failed=1; fi; done; if [ "$found" = 0 ]; then echo "[AMLgsMenu] No ack_timeout found under /proc/net" >&2; exit 1; fi; exit "$failed"'
bad_frame_drop = echo 0 > /sys/module/amvdec_h265/parameters/error_handle_policy && echo 0 > /sys/module/amvdec_h265/parameters/hacked_lowlatency && echo 2 > /sys/module/amvdec_h265/parameters/nal_skip_policy && echo 1,1,1,1,1,1,1,1,1 > /sys/module/amvdec_h265/parameters/ref_frame_mark_flag
bad_frame_ignore = echo 432 > /sys/module/amvdec_h265/parameters/error_handle_policy && echo 1 > /sys/module/amvdec_h265/parameters/hacked_lowlatency && echo 0 > /sys/module/amvdec_h265/parameters/nal_skip_policy && echo 0 > /sys/module/amvdec_h265/parameters/ref_frame_mark_flag

[osd]
# Example: label = x|y|command
#custom1 = 100|200|/usr/bin/uptime
